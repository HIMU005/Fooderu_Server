openapi: 3.0.0
info:
  title: Post API
  version: 1.0.0
  description: This api documentation reflect the Behavior of post related api
  termsOfService: http://example.com/terms/
  contact:
    name: Hashanuz Zaman
    email: hashanuzzaman99@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Local server
  - url: https://fooderu-server.vercel.app
    description: Production server

paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      description: Retrieve a list of all posts.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of posts to return.
          schema:
            type: integer
            default: 5
            example: 5

        - name: skip
          in: query
          required: false
          description: Number of posts to skip for pagination.
          schema:
            type: integer
            default: 0
            example: 0
      responses:
        "200":
          description: Posts fetched successfully
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/GetPostsResponse"
        "500":
          $ref: "#/components/responses/500"

    post:
      tags:
        - Posts
      summary: Create a new post
      security:
        - BearerAuth: []
      description: Create a new post with the provided details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: A Post is created

        "400":
          $ref: "#/components/responses/400"

        "401":
          $ref: "#/components/responses/401"

        "403":
          $ref: "#/components/responses/403"

        "404":
          $ref: "#/components/responses/404"

        "500":
          $ref: "#/components/responses/500"

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Get a post by ID
      description: Retrieve a single post by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the post to retrieve.
          schema:
            type: string

      responses:
        "200":
          description: Post fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Post"
                  message:
                    type: string
                    example: Single post fetched

        "400":
          $ref: "#/components/responses/400"

        "401":
          $ref: "#/components/responses/401"

        "404":
          $ref: "#/components/responses/404"

        "500":
          $ref: "#/components/responses/500"

    put:
      tags:
        - Posts
      summary: Update a post
      description: Update a post by its ID. Only the owner of the restaurant can update the post.
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the post to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Post"
      responses:
        "200":
          description: Post updaed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Post updated successfully

        "400":
          $ref: "#/components/responses/400"

        "401":
          $ref: "#/components/responses/401"

        "403":
          $ref: "#/components/responses/403"

        "404":
          $ref: "#/components/responses/404"

        "500":
          $ref: "#/components/responses/500"

    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Delete a post by its ID. Only the owner of the restaurant can delete the post.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the post to delete.
          schema:
            type: string
      responses:
        "200":
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Post deleted successfully

        "400":
          $ref: "#/components/responses/400"

        "401":
          $ref: "#/components/responses/401"

        "403":
          $ref: "#/components/responses/403"

        "404":
          $ref: "#/components/responses/404"

        "500":
          $ref: "#/components/responses/500"

  /posts/followedRestaurantsPosts:
    get:
      tags:
        - Posts
      summary: Get posts from followed restaurants
      description: Retrieve posts from restaurants that the authenticated user follows.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Posts fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  message:
                    type: string
                    example: Followed restaurants posts fetched successfully

        "401":
          $ref: "#/components/responses/401"

        "500":
          $ref: "#/components/responses/500"

components:
  schemas:
    Post:
      type: object
      properties:
        restaurant_id:
          type: string
          example: 123123123
        description:
          type: string
          example: "description"
        image_url:
          type: string
          example: "imagelink"

        postType:
          type: string
          enum:
            - normal
            - menuItem
            - event
          example: normal

        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          example: "2023-10-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-10-01T12:00:00Z"
    CreatePostRequest:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          required:
            - restaurant_id

    Posts:
      type: array
      items:
        $ref: "#/components/schemas/Post"

    GetPostsResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/Posts"
        total:
          type: integer
          example: 100
        limit:
          type: integer
          example: 5
        skip:
          type: integer
          example: 0
        message:
          type: string
          example: "Posts fetched successfully"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400:
      description: Bad request - The server could not understand the request due to invalid syntax.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: "Bad request. Please check your input."

    401:
      description: Unauthorized - Invalid or missing authentication token.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
            example:
              status: 401
              message: "Unauthorized. Please provide a valid authentication token."

    403:
      description: Forbidden - Only the owner of the restaurant can perform this action.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 403
              message:
                type: string
                example: "Access forbidden. You do not have the necessary permissions."
            example:
              status: 403
              message: "Access forbidden. Only the owner of the restaurant can perform this action."

    404:
      description: Not Found - The requested resource could not be found.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: "Resource not found. Please check the URL and try again."
            example:
              status: 404
              message: "Resource not found. Please check the URL and try again."

    422:
      description: Unprocessable Entity - The request was well-formed but contains semantic errors.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 422
              message:
                type: string
                example: "Unprocessable Entity"
            example:
              status: 422
              message: "Unprocessable Entity"

    500:
      description: Internal Server Error - An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
            example:
              status: 500
              message: "An unexpected error occurred on the server...."
