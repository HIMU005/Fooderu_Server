  /menuItems/{menuItemId}/rate:
    post:
      summary: Rate a menu item
      description: |
        Submit or update a rating for a specific menu item.

        ## 🔒 Authentication Required
        - Requires a valid JWT token
        - User must be authenticated

        ## Rating Behavior
        - Creates a new rating if the user hasn't rated this menu item before
        - Updates existing rating if the user has already rated this item
        - Automatically recalculates the average rating and total ratings count
        - Validates rating value (must be between 1 and 5)

        ## How Ratings Work
        1. User submits rating between 1-5
        2. System creates/updates user's rating in MenuItemRating collection
        3. System recalculates average rating using aggregation
        4. System updates menu item's averageRating and totalRatings fields
        5. Returns updated average rating and total ratings count

        ## Notes
        - Users can only submit one rating per menu item (upsert behavior)
        - Rating updates immediately affect the menu item's average
        - Returns the updated average rating and total ratings count
      operationId: rateMenuItem
      tags:
        - Menu Items Rating
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to rate.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        description: |
          Rating data for the menu item.

          ### Rating Scale:
          - **1**: Poor
          - **2**: Fair
          - **3**: Good
          - **4**: Very Good
          - **5**: Excellent

          ### Examples:
          1. Submit a 5-star rating:
          ```json
          {
            "rating": 5
          }
          ```

          2. Update existing rating to 4 stars:
          ```json
          {
            "rating": 4
          }
          ```
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: number
                  format: float
                  description: |
                    Rating value for the menu item.
                    Must be between 1 and 5 (inclusive).
                  minimum: 1
                  maximum: 5
                  example: 4.5
              additionalProperties: false
            examples:
              fiveStar:
                summary: 5-star rating
                value:
                  rating: 5
              fourStar:
                summary: 4-star rating
                value:
                  rating: 4
              threePointFive:
                summary: 3.5-star rating
                value:
                  rating: 3.5
      responses:
        "200":
          description: Successfully rated menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Thanks for your rating."
                  averageRating:
                    type: number
                    format: float
                    description: Updated average rating for the menu item
                    minimum: 0
                    maximum: 5
                    example: 4.3
                  totalRatings:
                    type: integer
                    description: Updated total number of ratings
                    minimum: 0
                    example: 42
              examples:
                newRating:
                  summary: First time rating
                  description: User submits a rating for the first time
                  value:
                    status: "success"
                    message: "Thanks for your rating."
                    averageRating: 4.5
                    totalRatings: 1
                updateRating:
                  summary: Update existing rating
                  description: User updates their existing rating
                  value:
                    status: "success"
                    message: "Thanks for your rating."
                    averageRating: 4.3
                    totalRatings: 42

        "400":
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidId:
                  summary: Invalid ObjectId format
                  description: Menu item ID is not a valid MongoDB ObjectId
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Invalid Menu Item ID format"
                invalidRating:
                  summary: Invalid rating value
                  description: Rating is outside valid range (1-5)
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Rating must be between 1 and 5"
                missingRating:
                  summary: Missing rating field
                  description: Rating field is not provided in request body
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Rating is required"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                noToken:
                  summary: No token provided
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Not authorized, no token"
                invalidToken:
                  summary: Invalid or expired token
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Invalid or expired token"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  statusCode:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: "Menu item not found"
              examples:
                notFound:
                  summary: Menu item not found
                  description: Menu item with the provided ID does not exist
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Menu item not found"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  summary: POST /menuItems/507f1f77bcf86cd799439011/rate
                  description: General server error
                  value:
                    status: "error"
                    statusCode: 500
                    message: "Server error: Internal server error"

  /menuItems/{menuItemId}/myRating:
    get:
      summary: Get user's rating for a menu item
      description: |
        Retrieve the rating submitted by the currently authenticated user for a specific menu item.

        ## 🔒 Authentication Required
        - Requires a valid JWT token
        - User must be authenticated

        ## Behavior
        - Retrieves the specific rating given by the authenticated user
        - Returns 404 if the user hasn't rated this menu item yet
        - Validates MongoDB ObjectId format before querying

        ## Use Cases
        1. **Check if user has rated**: Determine if user has already rated this item
        2. **Display user's rating**: Show the user's own rating on the UI
        3. **Edit rating**: Get existing rating before allowing user to update it

        ## Notes
        - Returns the complete rating document including metadata
        - The response includes the rating value and timestamps
        - Useful for displaying "Your Rating: ⭐⭐⭐⭐⭐" on frontend
      operationId: getMyRating
      tags:
        - Menu Items Rating
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to check rating for.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: Successfully retrieved user's rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    $ref: "#/components/schemas/MenuItemRating"
                  message:
                    type: string
                    example: "Rating fetched for the item by this user successfully done"
              examples:
                hasRating:
                  summary: User has rated this item
                  description: User has previously rated this menu item
                  value:
                    status: "success"
                    data:
                      _id: "507f1f77bcf86cd799439051"
                      user: "507f1f77bcf86cd799439052"
                      menuItem: "507f1f77bcf86cd799439011"
                      rating: 4.5
                      createdAt: "2024-01-15T10:30:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
                    message: "Rating fetched for the item by this user successfully done"

        "400":
          description: Bad request - invalid menu item ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Invalid Menu Item ID format"
              examples:
                invalidId:
                  summary: Invalid ObjectId format
                  description: Menu item ID is not a valid MongoDB ObjectId
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Invalid Menu Item ID format"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                noToken:
                  summary: No token provided
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Not authorized, no token"
                invalidToken:
                  summary: Invalid or expired token
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Invalid or expired token"

        "404":
          description: Not found - User hasn't rated this menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  statusCode:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: "Rating not found for this menu item by this user"
              examples:
                notRated:
                  summary: User hasn't rated this item
                  description: Authenticated user hasn't rated this specific menu item
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Rating not found for this menu item by this user"
                notFound:
                  summary: Menu item not found
                  description: Menu item with the provided ID does not exist
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Menu item not found"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  summary: GET /menuItems/507f1f77bcf86cd799439011/myRating
                  description: General server error
                  value:
                    status: "error"
                    statusCode: 500
                    message: "Server error: Internal server error"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ## JWT Bearer Token Authentication

        ### Format:
        ```
        Authorization: Bearer <your_jwt_token>
        ```

        ### Token Details:
        - Tokens expire after **4 hours**
        - Obtain tokens from `/auth/login` or `/auth/register` endpoints
        - Tokens contain user ID, email, and user_type

        ### Example Header:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjYzMW... 
        ```

  parameters:
    ItemQueryParam:
      name: item
      in: query
      description: |
        Filter menu items by name.
        Supports partial matching and is case-insensitive.
      required: false
      schema:
        type: string
        example: "pizza"

    PriceQueryParam:
      name: price
      in: query
      description: |
        Maximum price filter.
        Returns items with price less than or equal to this value.
      required: false
      schema:
        type: number
        format: float
        minimum: 0
        example: 15.99

    RatingQueryParam:
      name: rating
      in: query
      description: |
        Maximum average rating filter.
        Returns items with average rating less than or equal to this value.
        Must be between 0 and 5.
      required: false
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 5
        example: 4.5

    PlaceQueryParam:
      name: place
      in: query
      description: |
        Filter by restaurant location.
        Searches in the restaurant's `mapAddress` field.
        Case-insensitive partial match.
        **Note:** This filter is applied after database query
      required: false
      schema:
        type: string
        example: "New York"

    FieldsQueryParam:
      name: fields
      in: query
      description: |
        Comma-separated list of fields to include in the response for each menu item.
        Example: `name,price,averageRating`

        ## Available Fields:
          - **Menu Item fields**: _id, name, price, description, image_url, is_boosted, boosted_until, averageRating, totalRatings, createdAt, updatedAt
          - **Restaurant fields**: restaurant_id._id, restaurant_id.name, restaurant_id.displayPicture, restaurant_id.address
          
          ## Examples:
          - `fields=name,price` → Returns only name and price
          - `fields=name,description,restaurant_id.name` → Includes nested restaurant name
          - `fields=*` → Returns all fields (default)
          
          ## Notes:
          - Field names are case-sensitive
          - Use dot notation for nested fields (e.g., `restaurant_id.name`)
          - Invalid field names are ignored
      required: false
      schema:
        type: string
        pattern: '^([a-zA-Z0-9_.]+(,[a-zA-Z0-9_.]+)*|\*)$'
        example: "name,price,description,restaurant_id.name"
        default: "*"

  schemas:
    AppErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["fail", "error"]
          description: Status type (fail for 4xx errors, error for 5xx errors)
          example: "fail"
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Human-readable error message
          example: "Invalid Menu Item ID format"

    UnauthorizedError:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 401
            status:
              type: string
              example: "fail"

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 400
            status:
              type: string
              example: "fail"

    NotFoundError:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 404
            status:
              type: string
              example: "fail"

    ForbiddenError:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 403
            status:
              type: string
              example: "fail"

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 500
            status:
              type: string
              example: "error"

    ErrorDetail:
      type: object
      properties:
        msg:
          type: string
        param:
          type: string
        location:
          type: string

    MenuItemsResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
        message:
          type: string
          example: "All menu items fetched successfully"

    SingleMenuItemResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/MenuItem"
        message:
          type: string
          example: "Menu item fetched successfully"

    MenuItem:
      type: object
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the menu item
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          description: Name of the menu item
          maxLength: 100
          example: "Margherita Pizza"
        price:
          type: number
          format: float
          description: Price of the menu item
          minimum: 0
          example: 12.99
        description:
          type: string
          description: Detailed description of the menu item
          maxLength: 500
          example: "Classic pizza with tomato sauce and mozzarella"
        image_url:
          type: string
          format: uri
          description: URL to the menu item image
          example: "https://example.com/images/pizza.jpg"
        is_boosted:
          type: boolean
          description: Whether the item is currently boosted/promoted
          default: false
          example: false
        boosted_until:
          type: string
          format: date-time
          description: Timestamp until when the item is boosted
          example: "2024-12-31T23:59:59Z"
        averageRating:
          type: number
          format: float
          description: Average rating (0-5)
          minimum: 0
          maximum: 5
          default: 0
          example: 4.8
        totalRatings:
          type: integer
          description: Total number of ratings received
          minimum: 0
          default: 0
          example: 150
        restaurant_id:
          $ref: "#/components/schemas/RestaurantReference"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"

    MenuItemRating:
      type: object
      required:
        - user
        - menuItem
        - rating
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the rating record
          example: "507f1f77bcf86cd799439051"
        user:
          type: string
          format: objectid
          description: Reference to the user who submitted the rating
          example: "507f1f77bcf86cd799439052"
        menuItem:
          type: string
          format: objectid
          description: Reference to the menu item being rated
          example: "507f1f77bcf86cd799439011"
        rating:
          type: number
          format: float
          description: |
            Rating value given by the user.
            Must be between 1 and 5 (inclusive).
          minimum: 1
          maximum: 5
          example: 4.5
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the rating was created
          readOnly: true
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the rating was last updated
          readOnly: true
          example: "2024-01-16T14:20:00Z"
      description: |
        Represents a user's rating for a specific menu item.

        ## Database Constraints:
        - Each user can only rate a specific menu item once (unique compound index)
        - Rating values are validated to be between 1 and 5
        - Both user and menuItem references are required

        ## Indexes:
        - Compound unique index on `{ user: 1, menuItem: 1 }`
        - Ensures one rating per user per menu item

        ## Relationships:
        - `user`: References the `User` model
        - `menuItem`: References the `MenuItem` model

    RestaurantReference:
      type: object
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the restaurant
          example: "507f1f77bcf86cd799439012"
        name:
          type: string
          description: Name of the restaurant
          example: "Mario's Pizzeria"
        displayPicture:
          type: string
          format: uri
          description: URL to the restaurant's display picture
          example: "https://example.com/images/restaurant.jpg"
        address:
          $ref: "#/components/schemas/RestaurantAddress"

    RestaurantAddress:
      type: object
      properties:
        country:
          type: string
          description: Country name
          example: "United States"
        city:
          type: string
          description: City name
          example: "New York"
        manualAddress:
          type: string
          description: Manual address entry
          example: "123 Main St, Manhattan"
        mapAddress:
          type: string
          description: Address from map service
          example: "123 Main Street, New York, NY 10001, USA"

tags:
  - name: Menu Items
    description: Operations related to menu items
