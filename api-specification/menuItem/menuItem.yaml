openapi: 3.0.0
info:
  title: Restaurant Menu API
  version: 1.0.0
  description: |
    This API documentation reflects the behavior of menu item related APIs

     ## Authentication
    This API uses JWT Bearer Token authentication. Include the token in the Authorization header.

    ### How to Authenticate:
    1. Obtain a token from the `/auth/login` or `/auth/register` endpoints
    2. Include it in the Authorization header: `Bearer <your_token>`
    3. Token expires in 4 hours

    ### Token Format:
    ```
    Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ```
  contact:
    name: Jobaer Hossain
    email: jobaer6767@gmail.com

servers:
  - url: http://localhost:5000
    description: Local server
  - url: https://fooderu-server.vercel.app
    description: Production server

paths:
  /menuItems:
    get:
      summary: Get all menu items with filtering
      description: |
        Retrieve all menu items with optional filtering by name, price, rating, and location.

        ## Filtering Options
        - **item**: Filter by menu item name (case-insensitive partial match)
        - **price**: Filter by maximum price (items with price ≤ specified value)
        - **rating**: Filter by maximum rating (items with average rating ≤ specified value)
        - **place**: Filter by restaurant location (case-insensitive partial match on restaurant address mapAddress)
        - **includeImages**: Include all image URLs in response (default: false)
        - **fields**: Comma-separated list of fields to return

        ## Sorting
        Results are automatically sorted by:
        1. Highest average rating first
        2. Most recently created first (for items with same rating)

        ## Image Handling
        - When `includeImages=true`, each menu item includes an `images` array with all image URLs
        - Images are sorted by `order` field, then by creation date
        - The `image_url` field is always included for backward compatibility
        - **Note**: `image_url` is NOT automatically updated to the first image in the images array. It remains as stored in the database.

        ## Notes
        - The `place` filter searches in `restaurant_id.address.mapAddress` field
        - All string comparisons are case-insensitive
        - No pagination is implemented - returns all matching items
      operationId: getAllMenuItems
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemQueryParam"
        - $ref: "#/components/parameters/PriceQueryParam"
        - $ref: "#/components/parameters/RatingQueryParam"
        - $ref: "#/components/parameters/PlaceQueryParam"
        - $ref: "#/components/parameters/FieldsQueryParam"
        - $ref: "#/components/parameters/IncludeImagesQueryParam"

      responses:
        "200":
          description: Successfully retrieved menu items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemsResponse"
              examples:
                allFields:
                  summary: GET /menuItems
                  description: Default response with all fields when no filters are applied
                  value:
                    status: "success"
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        image_url: "https://example.com/images/pizza.jpg"
                        images: []
                        is_boosted: false
                        boosted_until: null
                        averageRating: 4.8
                        totalRatings: 150
                        restaurant_id:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Mario's Pizzeria"
                          displayPicture: "https://example.com/images/restaurant.jpg"
                          address:
                            country: "United States"
                            city: "New York"
                            manualAddress: "123 Main St, Manhattan"
                            mapAddress: "123 Main Street, New York, NY 10001, USA"
                        createdAt: "2024-01-15T10:30:00Z"
                        updatedAt: "2024-01-15T10:30:00Z"
                    message: "All menu items fetched successfully"

                withImages:
                  summary: GET /menuItems?includeImages=true
                  description: Response with all images included as URLs
                  value:
                    status: "success"
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        image_url: "https://example.com/images/pizza.jpg"
                        images:
                          - "https://example.com/images/pizza.jpg"
                          - "https://example.com/images/pizza-angle2.jpg"
                          - "https://example.com/images/pizza-angle3.jpg"
                        is_boosted: false
                        boosted_until: null
                        averageRating: 4.8
                        totalRatings: 150
                        restaurant_id:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Mario's Pizzeria"
                        createdAt: "2024-01-15T10:30:00Z"
                        updatedAt: "2024-01-15T10:30:00Z"
                    message: "All menu items fetched successfully"

                fieldSelection:
                  summary: GET /menuItems?fields=name,price,restaurant_id.name
                  description: Response with selected fields only
                  value:
                    status: "success"
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        restaurant_id:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Mario's Pizzeria"
                        images: []
                        image_url: "https://example.com/images/pizza.jpg"
                    message: "All menu items fetched successfully"

                placeFilter:
                  summary: GET /menuItems?place=New%20York
                  description: Filter by restaurant location
                  value:
                    status: "success"
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        image_url: "https://example.com/images/pizza.jpg"
                        images: []
                        is_boosted: false
                        boosted_until: null
                        averageRating: 4.8
                        totalRatings: 150
                        restaurant_id:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Mario's Pizzeria"
                          displayPicture: "https://example.com/images/restaurant.jpg"
                          address:
                            country: "United States"
                            city: "New York"
                            manualAddress: "123 Main St, Manhattan"
                            mapAddress: "123 Main Street, New York, NY 10001, USA"
                        createdAt: "2024-01-15T10:30:00Z"
                        updatedAt: "2024-01-15T10:30:00Z"
                    message: "All menu items fetched successfully"

                combinedFilters:
                  summary: GET /menuItems?item=pizza&price=15&rating=4.5&includeImages=true&fields=name,price,averageRating,images
                  description: Using multiple filters with field selection and images
                  value:
                    status: "success"
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        averageRating: 4.8
                        images:
                          - "https://example.com/images/pizza.jpg"
                          - "https://example.com/images/pizza-angle2.jpg"
                        image_url: "https://example.com/images/pizza.jpg"
                    message: "All menu items fetched successfully"

                noResults:
                  summary: GET /menuItems?item=sushi&price=5
                  description: Response when no items match the filters
                  value:
                    status: "success"
                    data: []
                    message: "All menu items fetched successfully"

        "400":
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidItem:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Item name must be a non-empty string"
                invalidPrice:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Price must be a valid non-negative number"
                invalidRating:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Rating must be a number between 0 and 5"
                invalidPlace:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Place must be a non-empty string"
                invalidFields:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Fields must be a string"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menuItems/{menuItemId}:
    get:
      summary: Get a single menu item by ID
      description: |
        Retrieve a single menu item by its unique identifier.

        ## Authentication Required
        This endpoint requires a valid JWT token in the Authorization header.

        ## Notes
        - Returns the complete menu item object
        - Populates restaurant information
        - Validates MongoDB ObjectId format before querying
      operationId: getMenuItemById
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to retrieve.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"

      responses:
        "200":
          description: Successfully retrieved menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    $ref: "#/components/schemas/MenuItem"
                  message:
                    type: string
                    example: "Menu item fetched successfully"

        "400":
          description: Bad request - invalid menu item ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidId:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Invalid Menu Item ID format"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
              examples:
                notFound:
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Menu item not found"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update a menu item
      description: |
        Update an existing menu item by its ID.

        ## 🔒 Authentication & Authorization Required
        - Requires a valid JWT token
        - Only the **owner of the restaurant** can update menu items

        ## Update Behavior
        - Updates only the fields provided in the request body
        - Validates data against the menu item schema
        - Returns the updated menu item with populated restaurant information

        ## Immutable Fields
        - `restaurant_id` cannot be changed (immutable field)
        - `_id` cannot be changed

        ## Valid Fields for Update
        All fields except `restaurant_id` and `_id` can be updated:
        - `name`, `price`, `description`, `image_url`
        - `is_boosted`, `boosted_until`
        - `averageRating`, `totalRatings` (typically updated by rating system)
      operationId: updateMenuItem
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to update.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        description: |
          Partial update data for the menu item.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Premium Margherita Pizza"
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 15.99
                description:
                  type: string
                  maxLength: 500
                  example: "Updated description with fresh ingredients"
                image_url:
                  type: string
                  format: uri
                  example: "https://example.com/images/updated-pizza.jpg"
                is_boosted:
                  type: boolean
                  example: true
                boosted_until:
                  type: string
                  format: date-time
                  example: "2024-12-31T23:59:59Z"
                averageRating:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 5
                  example: 4.9
                totalRatings:
                  type: integer
                  minimum: 0
                  example: 200
      responses:
        "200":
          description: Successfully updated menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Menuitem update successfully"
                  data:
                    $ref: "#/components/schemas/MenuItem"

        "400":
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a menu item
      description: |
        Delete a menu item by its ID.

        ## 🔒 Authentication & Authorization Required
        - Requires a valid JWT token
        - Only the **owner of the restaurant** can delete menu items

        ## Deletion Behavior
        - Permanently removes the menu item from the database
        - Performs ownership validation before deletion
        - Validates MongoDB ObjectId format before querying

        ## Notes
        - This operation is irreversible
        - Associated images in MenuItemImage collection are NOT automatically deleted
        - Returns success message without data on successful deletion
      operationId: deleteMenuItem
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to delete.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: Successfully deleted menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "MenuItem deleted successfully"

        "400":
          description: Bad request - invalid menu item ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menuItems/{menuItemId}/uploadImages:
    post:
      summary: Upload multiple images for a menu item
      description: |
        Upload multiple images and associate them with a menu item.

        ## 🔒 Authentication & Authorization Required
        - Requires a valid JWT token
        - Only the **owner of the restaurant** can upload images (TODO in controller)

        ## Upload Behavior
        - Supports up to 10 images per request
        - Each image must be ≤ 5MB
        - Allowed formats: JPEG, PNG, WEBP
        - Images are uploaded to ImageKit.io cloud storage
        - Images are automatically compressed if > 5MB

        ## Image Organization
        - **Order**: Images are assigned sequential order numbers (0, 1, 2...)
        - **Primary**: The first uploaded image is automatically set as primary
        - **Note**: Currently, only one upload session is allowed per menu item (multiple uploads will be enabled later)

        ## Database Storage
        Each image creates a record in MenuItemImage collection with:
        - `menuItemId`: Reference to the menu item
        - `url`: ImageKit URL
        - `isPrimary`: Boolean flag for primary image
        - `order`: Numeric order for sorting
        - `timestamps`: Created and updated dates

        ## Response
        Returns the saved image documents with their database IDs and metadata
      operationId: uploadMenuImages
      tags:
        - Menu Items
        - Images
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to upload images for.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        description: |
          Multipart form data containing image files.

          ### Field Name
          - Use `images` as the field name for all files

          ### File Requirements
          - **Max files**: 10
          - **Max file size**: 5MB per file
          - **Allowed types**: image/jpeg, image/png, image/jpg, image/webp
          - **File naming**: Files are renamed to include timestamp for uniqueness

          ### Example cURL
          ```bash
          curl -X POST http://localhost:5000/menuItems/507f1f77bcf86cd799439011/uploadImages \\
            -H "Authorization: Bearer <token>" \\
            -F "images=@/path/to/image1.jpg" \\
            -F "images=@/path/to/image2.jpg" \\
            -F "images=@/path/to/image3.jpg"
          ```
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of image files to upload
              required:
                - images
      responses:
        "201":
          description: Images successfully uploaded and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Successfully uploaded and saved 3 image(s)"
                  data:
                    type: object
                    properties:
                      menuItemId:
                        type: string
                        format: objectid
                        example: "507f1f77bcf86cd799439011"
                      images:
                        type: array
                        items:
                          $ref: "#/components/schemas/MenuItemImage"
              examples:
                success:
                  summary: Successful upload
                  value:
                    success: true
                    message: "Successfully uploaded and saved 3 image(s)"
                    data:
                      menuItemId: "507f1f77bcf86cd799439011"
                      images:
                        - _id: "507f1f77bcf86cd799439021"
                          url: "https://ik.imagekit.io/your-app/menu-items/image1.jpg"
                          isPrimary: true
                          order: 0
                          createdAt: "2024-01-15T10:30:00Z"
                        - _id: "507f1f77bcf86cd799439022"
                          url: "https://ik.imagekit.io/your-app/menu-items/image2.jpg"
                          isPrimary: false
                          order: 1
                          createdAt: "2024-01-15T10:30:00Z"
                        - _id: "507f1f77bcf86cd799439023"
                          url: "https://ik.imagekit.io/your-app/menu-items/image3.jpg"
                          isPrimary: false
                          order: 2
                          createdAt: "2024-01-15T10:30:00Z"

                partialSuccess:
                  summary: Partial success (some files failed)
                  value:
                    success: true
                    message: "Successfully uploaded and saved 2 image(s)"
                    data:
                      menuItemId: "507f1f77bcf86cd799439011"
                      images:
                        - _id: "507f1f77bcf86cd799439021"
                          url: "https://ik.imagekit.io/your-app/menu-items/image1.jpg"
                          isPrimary: true
                          order: 0
                          createdAt: "2024-01-15T10:30:00Z"
                        - _id: "507f1f77bcf86cd799439022"
                          url: "https://ik.imagekit.io/your-app/menu-items/image2.jpg"
                          isPrimary: false
                          order: 1
                          createdAt: "2024-01-15T10:30:00Z"
                    partialSuccess: true
                    uploadErrors:
                      - name: "invalid-image.gif"
                        error: "Invalid file type. Only JPEG, PNG, WEBP are allowed."

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "No files uploaded"
              examples:
                invalidId:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Invalid Menu Item ID format"
                noFiles:
                  value:
                    success: false
                    message: "No files uploaded"
                imagesExist:
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Images for this menu item already exist. Multiple uploads are not allowed currently."

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

        "500":
          description: Upload failed - all images failed to upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "All uploads failed"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "image1.jpg"
                        error:
                          type: string
                          example: "File too large"
              examples:
                allFailed:
                  value:
                    success: false
                    message: "All uploads failed"
                    errors:
                      - name: "image1.jpg"
                        error: "File size exceeds 5MB limit"
                      - name: "image2.gif"
                        error: "Invalid file type"

  /menuItems/{menuItemId}/rate:
    post:
      summary: Rate a menu item
      description: |
        Submit or update a rating for a specific menu item.

        ## 🔒 Authentication Required
        - Requires a valid JWT token
        - User must be authenticated

        ## Rating Behavior
        - Creates a new rating if the user hasn't rated this menu item before
        - Updates existing rating if the user has already rated this item
        - Automatically recalculates the average rating and total ratings count
        - Validates rating value (must be between 1 and 5)

        ## How Ratings Work
        1. User submits rating between 1-5
        2. System creates/updates user's rating in MenuItemRating collection
        3. System recalculates average rating using aggregation
        4. System updates menu item's averageRating and totalRatings fields
        5. Returns updated average rating and total ratings count

        ## Notes
        - Users can only submit one rating per menu item (upsert behavior)
        - Rating updates immediately affect the menu item's average
        - Returns the updated average rating and total ratings count
      operationId: rateMenuItem
      tags:
        - Menu Items Rating
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to rate.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        description: |
          Rating data for the menu item.

          ### Rating Scale:
          - **1**: Poor
          - **2**: Fair
          - **3**: Good
          - **4**: Very Good
          - **5**: Excellent
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: number
                  format: float
                  description: |
                    Rating value for the menu item.
                    Must be between 1 and 5 (inclusive).
                  minimum: 1
                  maximum: 5
                  example: 4.5
      responses:
        "200":
          description: Successfully rated menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Thanks for your rating."
                  averageRating:
                    type: number
                    format: float
                    description: Updated average rating for the menu item
                    minimum: 0
                    maximum: 5
                    example: 4.3
                  totalRatings:
                    type: integer
                    description: Updated total number of ratings
                    minimum: 0
                    example: 42

        "400":
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menuItems/{menuItemId}/myRating:
    get:
      summary: Get user's rating for a menu item
      description: |
        Retrieve the rating submitted by the currently authenticated user for a specific menu item.

        ## 🔒 Authentication Required
        - Requires a valid JWT token
        - User must be authenticated

        ## Behavior
        - Retrieves the specific rating given by the authenticated user
        - Returns 404 if the user hasn't rated this menu item yet
        - Validates MongoDB ObjectId format before querying
      operationId: getMyRating
      tags:
        - Menu Items Rating
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to check rating for.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: Successfully retrieved user's rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    $ref: "#/components/schemas/MenuItemRating"
                  message:
                    type: string
                    example: "Rating fetched for the item by this user successfully done"

        "400":
          description: Bad request - invalid menu item ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"

        "404":
          description: Not found - User hasn't rated this menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ## JWT Bearer Token Authentication

        ### Format:
        ```
        Authorization: Bearer <your_jwt_token>
        ```

        ### Token Details:
        - Tokens expire after **4 hours**
        - Obtain tokens from `/auth/login` or `/auth/register` endpoints
        - Tokens contain user ID, email, and user_type

        ### Example Header:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

  parameters:
    ItemQueryParam:
      name: item
      in: query
      description: |
        Filter menu items by name.
        Supports partial matching and is case-insensitive.
        Must be a non-empty string.
      required: false
      schema:
        type: string
        example: "pizza"

    PriceQueryParam:
      name: price
      in: query
      description: |
        Maximum price filter.
        Returns items with price less than or equal to this value.
        Must be a non-negative number.
      required: false
      schema:
        type: number
        format: float
        minimum: 0
        example: 15.99

    RatingQueryParam:
      name: rating
      in: query
      description: |
        Maximum average rating filter.
        Returns items with average rating less than or equal to this value.
        Must be a number between 0 and 5.
      required: false
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 5
        example: 4.5

    PlaceQueryParam:
      name: place
      in: query
      description: |
        Filter by restaurant location.
        Searches in the restaurant's `address.mapAddress` field.
        Case-insensitive partial match.
        Must be a non-empty string.
      required: false
      schema:
        type: string
        example: "New York"

    FieldsQueryParam:
      name: fields
      in: query
      description: |
        Comma-separated list of fields to include in the response for each menu item.
        Must be a string.

        ## Available Fields:
        - **Menu Item fields**: _id, name, price, description, image_url, is_boosted, boosted_until, averageRating, totalRatings, createdAt, updatedAt
        - **Restaurant fields**: restaurant_id._id, restaurant_id.name, restaurant_id.displayPicture, restaurant_id.address

        ## Notes:
        - `_id` is always included automatically
        - When `includeImages=true`, `images` and `image_url` are always included
        - For nested fields, use dot notation (e.g., `restaurant_id.name`)
        - Invalid field names are ignored

        ## Examples:
        - `fields=name,price` → Returns only name and price
        - `fields=name,description,restaurant_id.name` → Includes nested restaurant name
        - `fields=*` → Returns all fields (default)
      required: false
      schema:
        type: string
        pattern: '^([a-zA-Z0-9_.]+(,[a-zA-Z0-9_.]+)*|\*)$'
        example: "name,price,description,restaurant_id.name"
        default: "*"

    IncludeImagesQueryParam:
      name: includeImages
      in: query
      description: |
        Whether to include all images in the response.

        - `true`: Returns an `images` array with all image URLs
        - `false`: Returns only the `image_url` field (default)

        Images are sorted by order (0, 1, 2...) then by creation date.
      required: false
      schema:
        type: string
        enum: ["true", "false"]
        default: "false"
        example: "true"

  schemas:
    AppErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["fail", "error"]
          description: Status type (fail for 4xx errors, error for 5xx errors)
          example: "fail"
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Human-readable error message
          example: "Invalid Menu Item ID format"

    UnauthorizedError:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 401

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 400

    NotFoundError:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 404

    ForbiddenError:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 403

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/AppErrorResponse"
        - type: object
          properties:
            statusCode:
              type: integer
              example: 500
            status:
              type: string
              example: "error"

    MenuItemsResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
        message:
          type: string
          example: "All menu items fetched successfully"

    MenuItem:
      type: object
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the menu item
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          description: Name of the menu item
          maxLength: 100
          example: "Margherita Pizza"
        price:
          type: number
          format: float
          description: Price of the menu item
          minimum: 0
          example: 12.99
        description:
          type: string
          description: Detailed description of the menu item
          maxLength: 500
          example: "Classic pizza with tomato sauce and mozzarella"
        image_url:
          type: string
          format: uri
          description: |
            URL to the menu item image (stored in database).
            This field is NOT automatically updated when images are uploaded.
            For backward compatibility - this remains as stored.
          example: "https://example.com/images/pizza.jpg"
        images:
          type: array
          items:
            type: string
            format: uri
          description: |
            Array of all image URLs for this menu item.
            Only included when includeImages=true query parameter is used.
            Sorted by order field (0, 1, 2...) then by creation date.
            This comes from the MenuItemImage collection.
          example:
            - "https://example.com/images/pizza.jpg"
            - "https://example.com/images/pizza-angle2.jpg"
            - "https://example.com/images/pizza-angle3.jpg"
        is_boosted:
          type: boolean
          description: Whether the item is currently boosted/promoted
          default: false
          example: false
        boosted_until:
          type: string
          format: date-time
          description: Timestamp until when the item is boosted (null if not boosted)
          example: "2024-12-31T23:59:59Z"
        averageRating:
          type: number
          format: float
          description: Average rating (0-5)
          minimum: 0
          maximum: 5
          default: 0
          example: 4.8
        totalRatings:
          type: integer
          description: Total number of ratings received
          minimum: 0
          default: 0
          example: 150
        restaurant_id:
          $ref: "#/components/schemas/RestaurantReference"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"

    MenuItemImage:
      type: object
      required:
        - menuItemId
        - url
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the image record
          example: "507f1f77bcf86cd799439021"
        menuItemId:
          type: string
          format: objectid
          description: Reference to the menu item this image belongs to
          example: "507f1f77bcf86cd799439011"
        url:
          type: string
          format: uri
          description: URL of the uploaded image (from ImageKit)
          example: "https://ik.imagekit.io/your-app/menu-items/image1.jpg"
        isPrimary:
          type: boolean
          description: |
            Whether this is the primary image for the menu item.
            Only one image per menu item can be primary.
            First uploaded image is automatically set as primary.
          default: false
          example: true
        order:
          type: integer
          description: |
            Order number for sorting images (0, 1, 2...).
            Used to maintain image sequence.
          minimum: 0
          default: 0
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the image was added
          readOnly: true
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the image was last updated
          readOnly: true
          example: "2024-01-15T10:30:00Z"
      description: |
        Represents an image associated with a menu item.

        ## Database Constraints:
        - Each menu item can have multiple images
        - Only one image per menu item can have `isPrimary: true`
        - Images are ordered by the `order` field

        ## Indexes:
        - Index on `menuItemId` for efficient queries
        - Compound unique index on `{ menuItemId, isPrimary }` with partial filter for isPrimary=true

    MenuItemRating:
      type: object
      required:
        - user
        - menuItem
        - rating
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the rating record
          example: "507f1f77bcf86cd799439051"
        user:
          type: string
          format: objectid
          description: Reference to the user who submitted the rating
          example: "507f1f77bcf86cd799439052"
        menuItem:
          type: string
          format: objectid
          description: Reference to the menu item being rated
          example: "507f1f77bcf86cd799439011"
        rating:
          type: number
          format: float
          description: |
            Rating value given by the user.
            Must be between 1 and 5 (inclusive).
          minimum: 1
          maximum: 5
          example: 4.5
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the rating was created
          readOnly: true
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the rating was last updated
          readOnly: true
          example: "2024-01-16T14:20:00Z"

    RestaurantReference:
      type: object
      properties:
        _id:
          type: string
          format: objectid
          description: Unique identifier for the restaurant
          example: "507f1f77bcf86cd799439012"
        name:
          type: string
          description: Name of the restaurant
          example: "Mario's Pizzeria"
        displayPicture:
          type: string
          format: uri
          description: URL to the restaurant's display picture
          example: "https://example.com/images/restaurant.jpg"
        address:
          $ref: "#/components/schemas/RestaurantAddress"

    RestaurantAddress:
      type: object
      properties:
        country:
          type: string
          description: Country name
          example: "United States"
        city:
          type: string
          description: City name
          example: "New York"
        manualAddress:
          type: string
          description: Manual address entry
          example: "123 Main St, Manhattan"
        mapAddress:
          type: string
          description: Address from map service (used for place filtering)
          example: "123 Main Street, New York, NY 10001, USA"

tags:
  - name: Menu Items
    description: Operations related to menu items
  - name: Images
    description: Operations related to menu item images
  - name: Menu Items Rating
    description: Operations related to menu item ratings
