openapi: 3.0.0
info:
  title: Restaurant Menu API
  version: 1.0.0
  description: |
    This API documentation reflects the behavior of menu item related APIs

     ## Authentication
    This API uses JWT Bearer Token authentication. Include the token in the Authorization header.

    ### How to Authenticate:
    1. Obtain a token from the `/auth/login` or `/auth/register` endpoints
    2. Include it in the Authorization header: `Bearer <your_token>`
    3. Token expires in 4 hours

    ### Token Format:
    ```
    Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ```
  contact:
    name: Jobaer Hossain
    email: jobaer6767@gmail.com

servers:
  - url: http://localhost:5000
    description: Local server
  - url: https://fooderu-server.vercel.app
    description: Production server

paths:
  /menuItems:
    get:
      summary: Get all menu items with filtering
      description: |
        Retrieve all menu items with optional filtering by name, price, rating, and location.

        ## Filtering Options
        - **item**: Filter by menu item name (case-insensitive partial match)
        - **price**: Filter by maximum price (items with price ≤ specified value)
        - **rating**: Filter by maximum rating (items with average rating ≤ specified value)
        - **place**: Filter by restaurant location (case-insensitive partial match on mapAddress)

        ## Sorting
        Results are automatically sorted by highest average rating first.

        ## Notes
        - The `place` filter is applied after database query (client-side filtering)
        - All string comparisons are case-insensitive
        - No pagination is implemented - returns all matching items
      operationId: getAllMenuItems
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemQueryParam"
        - $ref: "#/components/parameters/PriceQueryParam"
        - $ref: "#/components/parameters/RatingQueryParam"
        - $ref: "#/components/parameters/PlaceQueryParam"
        - $ref: "#/components/parameters/FieldsQueryParam"

      responses:
        "200":
          description: Successfully retrieved menu items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemsResponse"
              examples:
                allFields:
                  summary: GET /menuItems
                  description: Default response with all fields when no filters are applied
                  value:
                    status: 200
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        image_url: "https://example.com/images/pizza.jpg"
                        is_boosted: false
                        boosted_until: null
                        averageRating: 4.8
                        totalRatings: 150
                        restaurant_id:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Mario's Pizzeria"
                          displayPicture: "https://example.com/images/restaurant.jpg"
                          address:
                            country: "United States"
                            city: "New York"
                            manualAddress: "123 Main St, Manhattan"
                            mapAddress: "123 Main Street, New York, NY 10001, USA"
                        createdAt: "2024-01-15T10:30:00Z"
                        updatedAt: "2024-01-15T10:30:00Z"
                    message: "All menu items fetched successfully"

                itemFilterWithFields:
                  summary: GET /menuItems?item=pizza&fields=name,price,description,restaurant_id.name
                  description: Response when filtering by item name and selecting specific fields
                  value:
                    status: 200
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        restaurant_id:
                          id: "507f1f77bcf86cd799439043"
                          name: "Mario's Pizzeria"
                      - _id: "507f1f77bcf86cd799439012"
                        name: "Pepperoni Pizza"
                        price: 14.99
                        description: "Pizza with pepperoni and cheese"
                        restaurant_id:
                          name: "Tony's Pizza"
                    message: "All menu items fetched successfully"

                priceFilter:
                  summary: GET /menuItems?price=15
                  description: Response when filtering by maximum price (all fields included)
                  value:
                    status: 200
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        image_url: "https://example.com/images/pizza.jpg"
                        is_boosted: false
                        averageRating: 4.8
                        totalRatings: 150
                        restaurant_id:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Mario's Pizzeria"
                          displayPicture: "https://example.com/images/restaurant.jpg"
                          address:
                            mapAddress: "123 Main Street, New York, NY 10001, USA"
                        createdAt: "2024-01-15T10:30:00Z"
                        updatedAt: "2024-01-15T10:30:00Z"
                    message: "All menu items fetched successfully"

                ratingFilterMinimal:
                  summary: GET /menuItems?rating=4.5&fields=_id,name,price,averageRating
                  description: Response when filtering by rating and selecting only essential fields
                  value:
                    status: 200
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        averageRating: 4.8
                      - _id: "507f1f77bcf86cd799439013"
                        name: "Pepperoni Pizza"
                        price: 14.99
                        averageRating: 4.7
                    message: "All menu items fetched successfully"

                placeFilter:
                  summary: GET /menuItems?place=New%20York&fields=name,price,description,averageRating,restaurant_id.name,restaurant_id.address.mapAddress
                  description: Response when filtering by location (place parameter)
                  value:
                    status: 200
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        averageRating: 4.8
                        restaurant_id:
                          id: "507f1f77bcf86cd799439054"
                          name: "Mario's Pizzeria"
                          address:
                            mapAddress: "123 Main Street, New York, NY 10001, USA"
                    message: "All menu items fetched successfully"

                combinedFilters:
                  summary: GET /menuItems?item=pizza&price=20&rating=4
                  description: Response when using item, price, and rating filters together
                  value:
                    status: 200
                    data:
                      - _id: "507f1f77bcf86cd799439011"
                        name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                        averageRating: 4.8

                    message: "All menu items fetched successfully"

                nestedFields:
                  summary: GET /menuItems?fields=name,restaurant_id.name,restaurant_id.displayPicture,restaurant_id.address.city,restaurant_id.address.mapAddress
                  description: Response with nested restaurant fields only
                  value:
                    status: 200
                    data:
                      - name: "Margherita Pizza"
                        restaurant_id:
                          id: "507f1f77bcf86cd799439014"
                          name: "Mario's Pizzeria"
                          displayPicture: "https://example.com/images/restaurant.jpg"
                          address:
                            city: "New York"
                            mapAddress: "123 Main Street, New York, NY 10001, USA"
                      - name: "Pepperoni Pizza"
                        restaurant_id:
                          id: "507f1f77bcf86cd799439015"
                          name: "Tony's Pizza"
                          displayPicture: "https://example.com/images/tonys.jpg"
                          address:
                            city: "New York"
                            mapAddress: "456 Broadway, New York, NY 10002, USA"
                    message: "All menu items fetched successfully"

                noResults:
                  summary: GET /menuItems?item=sushi&price=5
                  description: Response when no items match the filters
                  value:
                    status: 200
                    data: []
                    message: "All menu items fetched successfully"

                fieldSelectionOnly:
                  summary: GET /menuItems?fields=name,price,description
                  description: Response with only selected fields (no filters)
                  value:
                    status: 200
                    data:
                      - name: "Margherita Pizza"
                        price: 12.99
                        description: "Classic pizza with tomato sauce and mozzarella"
                      - name: "Pepperoni Pizza"
                        price: 14.99
                        description: "Pizza with pepperoni and cheese"
                    message: "All menu items fetched successfully"

        "400":
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidItemNumber:
                  summary: GET /menuItems?item=123
                  description: Invalid item parameter
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Item name must be a non-empty string"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                noToken:
                  summary: No token provided
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Not authorized, no token"

        "404":
          description: Not found - Resource does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
              examples:
                notFound:
                  summary: Resource not found
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Menu Item not found"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  summary: Server error
                  value:
                    status: "error"
                    statusCode: 500
                    message: "Server error: Internal server error"

  /menuItems/{menuItemId}:
    get:
      summary: Get a single menu item by ID
      description: |
        Retrieve a single menu item by its unique identifier.

        ## Authentication Required
        This endpoint requires a valid JWT token in the Authorization header.

        ## Notes
        - Returns the complete menu item object
        - Populates restaurant information (name only)
        - Validates MongoDB ObjectId format before querying
      operationId: getMenuItemById
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to retrieve.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"

      responses:
        "200":
          description: Successfully retrieved menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/MenuItem"
                  message:
                    type: string
                    example: "Menu item fetched successfully"
              examples:
                success:
                  summary: GET /menuItems/507f1f77bcf86cd799439011
                  description: Successful response with menu item details
                  value:
                    status: 200
                    data:
                      _id: "507f1f77bcf86cd799439011"
                      name: "Margherita Pizza"
                      price: 12.99
                      description: "Classic pizza with tomato sauce and mozzarella"
                      image_url: "https://example.com/images/pizza.jpg"
                      is_boosted: false
                      boosted_until: null
                      averageRating: 4.8
                      totalRatings: 150
                      restaurant_id:
                        _id: "507f1f77bcf86cd799439012"
                        name: "Mario's Pizzeria"
                      createdAt: "2024-01-15T10:30:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
                    message: "Menu item fetched successfully"

        "400":
          description: Bad request - invalid menu item ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Invalid Menu Item ID format"
              examples:
                invalidId:
                  summary: Invalid ObjectId format
                  description: Menu item ID is not a valid MongoDB ObjectId
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Invalid Menu Item ID format"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                noToken:
                  summary: No token provided
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Not authorized, no token"
                invalidToken:
                  summary: Invalid or expired token
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Invalid or expired token"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  statusCode:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: "Menu Item not found"
              examples:
                notFound:
                  summary: Menu item not found
                  description: Menu item with the provided ID does not exist
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Menu Item not found"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  summary: GET /menuItems/507f1f77bcf86cd799439011
                  description: General server error
                  value:
                    status: "fail"
                    statusCode: 500
                    message: "Server error: Internal server error"

    put:
      summary: Update a menu item
      description: |
        Update an existing menu item by its ID.

        ## 🔒 Authentication & Authorization Required
        - Requires a valid JWT token
        - Only the **owner of the restaurant** can update menu items

        ## Update Behavior
        - Updates only the fields provided in the request body
        - Validates data against the menu item schema
        - Returns the updated menu item with populated restaurant information

        ## Immutable Fields
        - `restaurant_id` cannot be changed (immutable field)
        - `_id` cannot be changed

        ## Valid Fields for Update
        All fields except `restaurant_id` and `_id` can be updated:
        - `name`, `price`, `description`, `image_url`
        - `is_boosted`, `boosted_until`
        - `averageRating`, `totalRatings` (typically updated by rating system)
      operationId: updateMenuItem
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to update.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        description: |
          Partial update data for the menu item.

          ### Example Updates:
          1. Update price and description:
          ```json
          {
            "price": 15.99,
            "description": "Updated description with fresh ingredients"
          }
          ```

          2. Boost a menu item:
          ```json
          {
            "is_boosted": true,
            "boosted_until": "2024-12-31T23:59:59Z"
          }
          ```

          3. Update multiple fields:
          ```json
          {
            "name": "Premium Margherita Pizza",
            "price": 16.99,
            "image_url": "https://example.com/images/premium-pizza.jpg"
          }
          ```
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Premium Margherita Pizza"
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 15.99
                description:
                  type: string
                  maxLength: 500
                  example: "Updated description with fresh ingredients"
                image_url:
                  type: string
                  format: uri
                  example: "https://example.com/images/updated-pizza.jpg"
                is_boosted:
                  type: boolean
                  example: true
                boosted_until:
                  type: string
                  format: date-time
                  example: "2024-12-31T23:59:59Z"
                averageRating:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 5
                  example: 4.9
                totalRatings:
                  type: integer
                  minimum: 0
                  example: 200
              example:
                price: 15.99
                description: "Updated description with fresh ingredients"
                is_boosted: true
      responses:
        "200":
          description: Successfully updated menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Menuitem update successfully"
                  data:
                    $ref: "#/components/schemas/MenuItem"
              examples:
                success:
                  summary: PUT /menuItems/507f1f77bcf86cd799439011
                  description: Menu item successfully updated
                  value:
                    status: "success"
                    message: "Menuitem update successfully"
                    data:
                      _id: "507f1f77bcf86cd799439011"
                      name: "Premium Margherita Pizza"
                      price: 15.99
                      description: "Updated description with fresh ingredients"
                      image_url: "https://example.com/images/updated-pizza.jpg"
                      is_boosted: true
                      boosted_until: "2024-12-31T23:59:59Z"
                      averageRating: 4.9
                      totalRatings: 200
                      restaurant_id:
                        _id: "507f1f77bcf86cd799439012"
                        name: "Mario's Pizzeria"
                        displayPicture: "https://example.com/images/restaurant.jpg"
                      createdAt: "2024-01-15T10:30:00Z"
                      updatedAt: "2024-01-16T14:20:00Z"

        "400":
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidId:
                  summary: Invalid ObjectId format
                  description: Menu item ID is not a valid MongoDB ObjectId
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Invalid Menu Item ID format"

                validationError:
                  summary: Validation error
                  description: Request body validation failed
                  value:
                    status: "fail"
                    statusCode: 400
                    message: "Validation error"

        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                noToken:
                  summary: No token provided
                  value:
                    status: "fail"
                    statusCode: 401
                    message: "Not authorized, no token"

        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  statusCode:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: "Only the owner of the restaurant can update the menu item"
              examples:
                notOwner:
                  summary: Not restaurant owner
                  description: Authenticated user is not the owner of the restaurant
                  value:
                    status: "fail"
                    statusCode: 403
                    message: "Only the owner of the restaurant can update the menu item"

        "404":
          description: Not found - Menu item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
              examples:
                notFound:
                  summary: Menu item not found
                  description: Menu item with the provided ID does not exist
                  value:
                    status: "fail"
                    statusCode: 404
                    message: "Menu item not found"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  summary: PUT /menuItems/507f1f77bcf86cd799439011
                  description: General server error
                  value:
                    status: "error"
                    statusCode: 500
                    message: "Server error: Internal server error"

    delete:
      summary: Delete a menu item
      description: |
        Delete a menu item by its ID.

        ## 🔒 Authentication & Authorization Required
        - Requires a valid JWT token
        - Only the **owner of the restaurant** can delete menu items

        ## Deletion Behavior
        - Permanently removes the menu item from the database
        - Performs ownership validation before deletion
        - Validates MongoDB ObjectId format before querying

        ## Notes
        - This operation is irreversible
        - Associated ratings and reviews may be affected (cascade handling depends on implementation)
        - Returns success message without data on successful deletion
      operationId: deleteMenuItem
      tags:
        - Menu Items
      security:
        - BearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          description: |
            Unique identifier of the menu item to delete.

            Must be a valid MongoDB ObjectId (24-character hex string).
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: Successfully deleted menu item
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "MenuItem deleted successfully"
              examples:
                success:
                  summary: DELETE /menuItems/507f1f77bcf86cd799439011
                  description: Menu item successfully deleted
                  value:
                    status: "success"
                    message: "MenuItem deleted successfully"

        "400":
          description: Bad request - invalid menu item ID format
