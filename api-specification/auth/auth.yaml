tags:
  - name: Authentication
    description: |
      ## 🔐 Authentication & User Management

      Endpoints for user registration, login, and account management.
      Supports multiple authentication methods for flexibility.

      ### 📋 Available Methods
      1. **Traditional**: Email/Password with verification
      2. **OTP-based**: Email/Password with OTP verification (recommended)
      3. **Social**: Google, Facebook, Clerk, Firebase
      4. **Email Verification**: Link-based and OTP-based

      ### 🎯 Recommended Flow
      For new implementations, use OTP-based registration:
      ```
      POST /auth/register_otp → POST /auth/verify_otp → POST /auth/login
      ```

      ### 🔒 Security Features
      - JWT tokens with 4-hour expiry
      - Password hashing with bcrypt
      - Email enumeration protection
      - Rate limiting on OTP requests
      - Conflict prevention for social logins
