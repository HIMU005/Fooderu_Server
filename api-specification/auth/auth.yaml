        restaurant_id:
          type: string
          format: objectid
          description: Reference to owned restaurant (if restaurant owner)
          example: "507f1f77bcf86cd799439022"
        hasRestaurant:
          type: boolean
          description: Whether user owns a restaurant
          default: false
          example: true
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"
