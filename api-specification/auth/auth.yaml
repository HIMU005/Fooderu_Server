      description: |
        ## 👤 User Model

        Represents a user in the Fooderu system.
        Users can be customers or restaurant owners.

        ### 🏷️ User Types
        - **user**: Regular customer
        - **admin**: System administrator

        ### 🔐 Authentication Methods
        - **Email/Password**: Traditional login
        - **Social OAuth**: Google, Facebook, etc.
        - **Clerk**: Professional auth service
        - **Firebase**: Google Firebase auth

        ### 🏪 Restaurant Owners
        - `restaurant_id`: Reference to owned restaurant
        - `hasRestaurant`: Boolean flag
        - Restaurant owners have additional privileges

    OTP:
      type: object
      properties:
        _id:
          type: string
          format: objectid
          description: Unique OTP identifier
          example: "507f1f77bcf86cd799439051"
        email:
          type: string
          format: email
          description: Recipient email address
          example: "user@example.com"
        userId:
          type: string
          format: objectid
          description: Reference to user
          example: "507f1f77bcf86cd799439011"
        otp:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-digit one-time password
          example: "123456"
        purpose:
          type: string
          description: Purpose of the OTP
          enum: ["email_verification", "password_reset", "account_recovery"]
          default: "email_verification"
          example: "email_verification"
        attempts:
          type: integer
          description: Number of verification attempts
          minimum: 0
          maximum: 5
          default: 0
          example: 1
        expiresAt:
          type: string
          format: date-time
          description: OTP expiration timestamp
          example: "2024-01-15T10:35:00Z"
        isUsed:
          type: boolean
          description: Whether OTP has been used
          default: false
          example: false
        ipAddress:
          type: string
          description: IP address of requestor
          example: "192.168.1.1"
        userAgent:
          type: string
          description: User agent of requestor
          example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
        createdAt:
          type: string
          format: date-time
          description: OTP creation timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
          example: "2024-01-15T10:30:00Z"
      description: |
        ## 🔢 OTP Model

        One-Time Password for email verification.
        Automatically expires after 5 minutes.

        ### ⚙️ Database Indexes
        - Compound index on `{email, purpose, isUsed}`
        - TTL index on `expiresAt` (auto-delete after 5min)
        - Compound index on `{userId, expiresAt}`

        ### 🔒 Security Features
        - Auto-cleanup of old unused OTPs
        - Attempt counter (max 5 attempts)
        - Single-use only
        - Rate limiting protection

    LoginResponse:
